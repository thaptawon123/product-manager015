services:
  postgres-db:
    image: postgres:15-alpine
    container_name: express_postgres_container
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dav_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-product_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dav_user} -d ${POSTGRES_DB:-product_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./ba:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: ${DB_HOST:-postgres-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-product_db}
      DB_USER: ${DB_USER:-dav_user}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password}
    command: >-
      sh -c 'if [ "$$NODE_ENV" = "development" ]; then npm install && npm run dev;
      else npm install --omit=dev && npm start;
      fi'
    ports:
      - "${BACKEND_PORT:-5000}:4000"
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./fo:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --force"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules: